<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a14">
<title>Create account — NEXIFING</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
<div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>
<div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>
<div class="cursor-trail" id="cursorTrail" aria-hidden="true"></div>
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<header class="header" id="header">
  <div class="header-inner wrap">
    <a href="index.html" class="logo">
      <img src="nexifing-logo.png" alt="" onerror="this.style.display='none'">
      <span>NEXIFING</span>
    </a>
    <nav class="nav" id="nav">
      <a href="services.html">Services</a>
      <a href="work.html">Work</a>
      <a href="pricing.html">Pricing</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="contact.html" class="nav-cta">Start a project</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="main">

<section class="section auth-section">
  <div class="wrap auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <span class="section-label">JOIN NEXIFING</span>
        <h1 class="auth-title">Create account</h1>
        <p class="auth-sub">Sign up once and get 30% off your second project. 50% off after three.</p>
      </div>

      <form id="signupForm" class="auth-form" novalidate>
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="At least 6 characters" required>
        </div>
        <div class="auth-field">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" placeholder="Same as above" required>
        </div>
        <div class="auth-note" id="authNote"></div>
        <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%">Create account</button>
      </form>

      <div class="auth-footer">
        <span>Already have an account?</span>
        <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>
</section>

</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none;padding-top:0;justify-content:center;text-align:center">
      <span>© <span data-year>2025</span> NEXIFING — All rights reserved</span>
    </div>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var form = document.getElementById('signupForm');
  var note = document.getElementById('authNote');
  var btn  = document.getElementById('submitBtn');

  Nexifing.auth.onAuth(function (user) {
    if (user) window.location.href = 'dashboard.html';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email   = document.getElementById('email').value.trim();
    var pw      = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;

    if (!email || !pw || !confirm) {
      note.textContent = 'Fill in all fields.';
      note.style.color = 'var(--danger)';
      return;
    }
    if (pw.length < 6) {
      note.textContent = 'Password must be at least 6 characters.';
      note.style.color = 'var(--danger)';
      return;
    }
    if (pw !== confirm) {
      note.textContent = 'Passwords do not match.';
      note.style.color = 'var(--danger)';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account…';
    note.textContent = '';

    Nexifing.auth.signup(email, pw)
      .then(function () {
        note.textContent = 'Account created. Redirecting…';
        note.style.color = 'var(--success)';
        setTimeout(function () { window.location.href = 'dashboard.html'; }, 500);
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Create account';
        note.style.color = 'var(--danger)';
        if (err.code === 'auth/email-already-in-use') {
          note.textContent = 'That email already has an account. Try signing in.';
        } else if (err.code === 'auth/invalid-email') {
          note.textContent = 'Invalid email address.';
        } else if (err.code === 'auth/weak-password') {
          note.textContent = 'Password is too weak.';
        } else {
          note.textContent = err.message || 'Something went wrong.';
        }
      });
  });
});
</script>

</body>
</html>
