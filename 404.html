<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0c">
<title>404 — Page not found · NEXIFING</title>
<meta name="description" content="This page doesn't exist. Head back to NEXIFING or check our work.">
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* 404-specific — page height + centered layout */
  .error-page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:120px 24px 80px;
    position:relative;
    overflow:hidden;
  }
  .error-page-bg{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  .error-page-inner{
    position:relative;
    z-index:1;
    max-width:640px;
    width:100%;
  }
  .error-code{
    font-family:var(--font-display);
    font-size:clamp(6rem,20vw,14rem);
    font-weight:600;
    line-height:.9;
    letter-spacing:-.06em;
    background:var(--aurora);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    margin-bottom:24px;
    user-select:none;
  }
  .error-title{
    font-family:var(--font-display);
    font-size:clamp(1.4rem,3vw,2rem);
    font-weight:600;
    letter-spacing:-.03em;
    line-height:1.15;
    margin-bottom:20px;
  }
  .error-sub{
    font-size:1.05rem;
    color:var(--text-3);
    line-height:1.7;
    margin-bottom:40px;
    max-width:480px;
    margin-left:auto;
    margin-right:auto;
  }
  .error-actions{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:56px;
  }
  .error-links{
    padding-top:32px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:center;
    gap:32px;
    flex-wrap:wrap;
  }
  .error-links a{
    font-family:var(--font-display);
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-4);
    transition:color .2s var(--ease);
  }
  .error-links a:hover{color:var(--iris)}
  .error-hint{
    margin-top:32px;
    font-family:var(--font-display);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-5);
  }
  .error-hint kbd{
    display:inline-block;
    padding:2px 8px;
    background:var(--surface);
    border:1px solid var(--border-2);
    border-radius:4px;
    font-family:var(--font-display);
    font-size:10px;
    color:var(--text-3);
    margin:0 2px;
  }
  @media(max-width:640px){
    .error-actions{flex-direction:column;align-items:stretch}
    .error-actions .btn{width:100%}
  }
</style>
</head>
<body>

<section class="error-page">
  <div class="error-page-bg" aria-hidden="true">
    <div class="aurora-beam"></div>
    <div class="aurora-glow aurora-iris"></div>
    <div class="aurora-glow aurora-ember"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="error-page-inner">
    <div class="error-code">404</div>
    <h1 class="error-title">This page doesn't exist.</h1>
    <p class="error-sub">
      The link might be broken, the page might have been moved, or you typed the URL wrong. Either way — it's not here.
    </p>

    <div class="error-actions">
      <a href="/" class="btn btn-primary">Back to home</a>
      <a href="work.html" class="btn btn-ghost">See our work</a>
    </div>

    <div class="error-links">
      <a href="services.html">Services</a>
      <a href="work.html">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>

    <p class="error-hint">
      Or press <kbd>g</kbd> then <kbd>h</kbd> to go home
    </p>
  </div>
</section>

</body>
</html>
